[project]
name = "monitorforge-core"
version = "0.1.0"
description = "Shared canonical schema and ingestion contract for environmental monitoring web apps"
requires-python = ">=3.11"
dependencies = [
    "Flask-SQLAlchemy>=3.1",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "Flask>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
